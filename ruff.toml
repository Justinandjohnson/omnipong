# Ruff configuration for the OmniPong repo.
#
# Why this exists: with no config, ruff falls back to its defaults, which in
# recent builds select nearly every rule — so the guardrails pre-commit hook and
# CI flagged hundreds of stylistic findings (trailing whitespace, import order
# after a deliberate sys.path bootstrap, `Optional[X]` -> `X | None` churn, etc.)
# that don't reflect how this codebase is actually written. Pinning the ruleset
# makes local commits and CI deterministic and shippable.
#
# The selection below is the useful, correctness-oriented core. Everything it
# reports is fixed in-tree, so `ruff check` (and therefore the hook) passes.

target-version = "py313"
line-length = 120

[lint]
select = [
    "F",              # pyflakes: undefined names, unused imports/vars — real bugs
    "E4",             # pycodestyle: import errors (E401, E402)
    "E7",             # pycodestyle: statement/comparison issues (E711, E722)
    "E9",             # pycodestyle: runtime syntax errors
    "W",              # pycodestyle warnings, incl. W605 invalid escape sequences
    "I",              # import sorting
    "UP",             # pyupgrade
    "RUF",            # ruff-specific rules
]

ignore = [
    "W291",           # trailing whitespace — formatting noise, not enforced here
    "W293",           # whitespace on blank lines — formatting noise
    "E402",           # module import not at top: intentional sys.path bootstrap
    "E701",           # multiple statements on one line (legacy but harmless)
    "UP045",          # Optional[X] -> X | None: keep the existing annotation style
    "UP035",          # deprecated import churn (typing re-exports)
    "UP037",          # quoted-annotation churn
    "RUF001",         # ambiguous unicode in strings: intentional site content
    "RUF006",         # fire-and-forget asyncio.create_task(): intentional
    "RUF100",         # unused noqa
]

[lint.per-file-ignores]
# Tests intentionally assert on broad behaviour and reuse loose fixtures.
"tests/**" = ["RUF059"]
"rubberr/backend/tests/**" = ["RUF059"]
