services:
  # Backend Service (FastAPI)
  - type: web
    name: omnipong-backend
    env: python
    rootDir: rubberr/backend
    buildCommand: "pip install -r ../../requirements.txt && pip install uvicorn gunicorn"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: omnipong-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # Frontend Service (Next.js)
  - type: web
    name: omnipong-frontend
    env: node
    rootDir: rubberr/frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: omnipong-db
    databaseName: omnipong
    user: omnipong_user
    plan: free # or starter
