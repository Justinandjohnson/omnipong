services:
  # Backend Service (FastAPI)
  - type: web
    name: omnipong-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: omnipong-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # Frontend Service (Next.js)
  - type: web
    name: omnipong-frontend
    env: node
    buildCommand: "npm install --prefix rubberr/frontend && npm run build --prefix rubberr/frontend"
    startCommand: "npm start --prefix rubberr/frontend"
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: omnipong-db
    databaseName: omnipong
    user: omnipong_user
    plan: free # or starter
